<!DOCTYPE html>
<html class="theme_dark">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Start bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/website_icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    
    <!-- Fonts & Styles -->
    <link href="css/font-roboto.css" rel="stylesheet" type="text/css">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" media="screen">

    <!-- Custom Styles for Card Optimization -->
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; }
        .page_wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .page { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 24px; 
            padding: 40px 30px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            backdrop-filter: blur(10px);
        }
        .page_photo { margin-bottom: 20px; }
        .page_photo_image { 
            width: 100px !important; 
            height: 100px !important; 
            border-radius: 50%; 
            object-fit: cover; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
            border: 4px solid #fff;
        }
        .page_title { font-size: 24px; font-weight: 700; color: #1c2e3a; margin-bottom: 30px; line-height: 1.3; }
        .action_button_new { 
            display: block; 
            width: 100%; 
            padding: 18px 0; 
            font-size: 18px; 
            font-weight: 600; 
            border-radius: 16px; 
            text-decoration: none; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
            color: #fff;
            box-shadow: 0 8px 20px rgba(42, 171, 238, 0.4);
        }
        .action_button_new:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(42, 171, 238, 0.3); }
        
        /* Dark theme support if needed */
        .theme_dark .page { background: rgba(30, 30, 30, 0.95); }
        .theme_dark .page_title { color: #fff; }
    </style>

    <!-- Meta Pixel Code -->
    <script>
        !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
                n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
            n.queue = []; t = b.createElement(e); t.async = !0;
            t.src = v; s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1413695077434129');
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1413695077434129&ev=PageView&noscript=1" /></noscript>
    <!-- End Meta Pixel Code -->

</head>

<body class="">
    <div class="background_wrap">
        <canvas id="background" class="background default" width="50" height="50" data-colors="dbddbb,6ba587,d5d88d,88b884"></canvas>
        <div class="background_pattern default"></div>
    </div>
    
    <div class="page_wrap">
        <div class="page">
            <!-- Логотип / Аватарка -->
            <div class="page_photo">
                <a href="tg://join?invite=sU-JbfC2GIY0NTIy" onclick="fbq('track', 'Lead')">
                    <img class="page_photo_image" src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram Logo">
                </a>
            </div>
            
            <!-- Заголовок -->
            <div class="page_title" dir="auto">
                <span dir="auto">Пантера</span>
            </div>
            
            <!-- Кнопка -->
            <div class="page_action">
                <a class="action_button_new shine" onclick="fbq('track', 'Lead')" href="tg://join?invite=sU-JbfC2GIY0NTIy">
                    Join Channel
                </a>
            </div>
        </div>
    </div>

    <div id="frame_cont"></div>

    <!-- Background Animation -->
    <script src="js/wallpaper.js"></script>
    <script type="text/javascript">
        var tme_bg = document.getElementById('background');
        if (tme_bg) {
            TWallpaper.init(tme_bg);
            TWallpaper.animate(true);
            window.onfocus = function () { TWallpaper.update(); };
        }
        document.body.classList.remove('no_transition');
        function toggleTheme(dark) {
            window.Telegram && Telegram.setWidgetOptions({ dark: dark });
        }
        if (window.matchMedia) {
            var darkMedia = window.matchMedia('(prefers-color-scheme: dark)');
            toggleTheme(darkMedia.matches);
            darkMedia.addListener(function (e) { toggleTheme(e.matches); });
        }
    </script>

    <!-- Analytics -->
    <script src="js/tracker_etap1.js"></script>

</body>
</html>
