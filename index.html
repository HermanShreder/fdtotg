  <!-- USER ANALYTICS CONFIG -->
  <script>
    window.USERANALYTICS = {
      "google": "",
      "facebook": "1413695077434129",

  <!-- META PIXEL & CAPI INFRASTRUCTURE -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;
      n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
      t=b.createElement(e);t.async=!0;t.src=v;
      s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)
    }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

    function fbGenEventId() {
      return typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random().toString(36).substring(2) + Date.now().toString(36);
    }

    function fbSendToCAPI({ eventName, eventId, customData, userData }) {
      var ua = window.USERANALYTICS;
      if (!ua.hasFacebookCapi || !ua.websiteId) return;
      var blob = new Blob([JSON.stringify({
        eventName: eventName,
        eventId: eventId,
        sourceUrl: location.href,
        fbp: (document.cookie.match(/_fbp=([^;]+)/) || [])[1],
        fbc: (document.cookie.match(/_fbc=([^;]+)/) || [])[1],
        customData: customData || null,
        email: userData && userData.email,
        phone: userData && userData.phone
      })], { type: 'application/json' });
      
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/userpage/api/websites/' + ua.websiteId + '/track', blob);
      }
    }

    // Initialize Meta Pixel & Track PageView
    fbq('init', '1413695077434129');
    var pageViewEid = fbGenEventId();
    fbq('track', 'PageView', {}, { eventID: pageViewEid });
    fbSendToCAPI({ eventName: 'PageView', eventId: pageViewEid });
  </script>

  <!-- STYLES (PRESERVED FROM CODE 2) -->
  <style>
    :root {

      --card-bg: #1a1d24;

        135deg,
        #667eea 0%,
        #764ba2 100%

      --text-primary: #ffffff;
      --text-secondary: #a0a3b1;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 20px rgba(102, 126, 234, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,

      background-color: var(--bg-color);
      color: var(--text-primary);

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      padding: 20px;

      line-height: 1.6;
    }

    .container {
      background: var(--card-bg);
      border-radius: 20px;

      padding: 40px 30px;

      max-width: 420px;
      width: 100%;

      text-align: center;

      box-shadow: var(--shadow-soft);

      border: 1px solid rgba(255, 255, 255, 0.05);

      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";

      position: absolute;

      top: -50%;
      left: -50%;

      width: 200%;
      height: 200%;

      background:
        radial-gradient(
          circle,
          rgba(102, 126, 234, 0.1) 0%,

      pointer-events: none;
    }

    .logo {
      width: 80px;
      height: 80px;

      background: var(--primary-gradient);

      border-radius: 50%;

      margin: 0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: var(--shadow-glow);

      position: relative;
      z-index: 1;
    }

    .logo svg {
      width: 40px;
      height: 40px;
      fill: white;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;

      margin-bottom: 12px;

      letter-spacing: -0.5px;

      position: relative;
      z-index: 1;
    }

    p.description {
      color: var(--text-secondary);

      font-size: 15px;

      margin-bottom: 32px;

      position: relative;
      z-index: 1;
    }

    .btn-telegram {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 16px 24px;

      background: var(--primary-gradient);

      color: white;

      text-decoration: none;

      font-weight: 600;
      font-size: 16px;

      border-radius: 12px;

      border: none;

      cursor: pointer;

      box-shadow:
        0 4px 15px rgba(102, 126, 234, 0.4);

      position: relative;
      z-index: 2;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-telegram:active {
      transform: scale(0.98);
    }

    .btn-telegram svg {
      width: 20px;
      height: 20px;

      margin-right: 10px;

      fill: currentColor;

      flex-shrink: 0;
    }

    .footer-note {
      margin-top: 24px;

      font-size: 12px;

      color: var(--text-secondary);

      opacity: 0.7;

      position: relative;

    .spinner {

      border: 2px solid rgba(255,255,255,0.3);

      border-radius: 50%;

      border-top-color: #fff;

      animation: spin 0.8s linear infinite;

      margin-right: 10px;

      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);

  <!-- REDIRECT & TRACKING SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tgButton = document.getElementById("tgButton");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");

      const TELEGRAM_URL = "https://t.me/+sU-JbfC2GIY0NTIy";

      tgButton.addEventListener("click", function (event) {
        event.preventDefault();

        // 1. Генерация Event IDs для точности склейки Pixel + CAPI
        var leadEid = fbGenEventId();
        var anyMessengerEid = fbGenEventId();
        var tgClickEid = fbGenEventId();

        // 2. Отправка событий в Facebook Pixel
        if (typeof fbq === "function") {
          try {
            fbq('track', 'Lead', {
              content_name: 'Telegram_Channel_Join',
              content_category: 'Engagement'
            }, { eventID: leadEid });

            fbq('track', 'fp_any_messenger_click', {}, { eventID: anyMessengerEid });
            fbq('track', 'fp_telegram_click', {}, { eventID: tgClickEid });
          } catch (e) {
            console.log("Meta Pixel error:", e);
          }
        }

        // 3. Отправка событий в Facebook CAPI
        try {
          fbSendToCAPI({ eventName: 'Lead', eventId: leadEid, customData: { content_name: 'Telegram_Channel_Join' } });
          fbSendToCAPI({ eventName: 'fp_any_messenger_click', eventId: anyMessengerEid });
          fbSendToCAPI({ eventName: 'fp_telegram_click', eventId: tgClickEid });
        } catch (e) {
          console.log("CAPI error:", e);
        }

        // 4. Визуальный отклик кнопки
        btnSpinner.style.display = "inline-block";
        btnText.textContent = "Переход...";

        // 5. Прямой редирект на Telegram
        window.location.href = TELEGRAM_URL;
      });
    });
  </script>
