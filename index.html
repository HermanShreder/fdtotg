<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Подтверждение домена Meta -->
  <meta name="facebook-domain-verification" content="1ddq5g9b9nlbak5619ajnlyjbz4xjt">

  <title>Telegram Channel</title>
  <meta name="description" content="Telegram channel — присоединяйтесь к нашему каналу">
  <meta name="theme-color" content="#08090d">
  <meta name="color-scheme" content="dark">

  <!-- ========================================== -->
  <!-- СКРИПТ КЛОАКИНГА (ПРОВЕРКА НА БОТОВ/META) -->
  <!-- ========================================== -->
  <script>
    (function() {
        function isBotOrModerator() {
            const ua = navigator.userAgent.toLowerCase();
            
            // 1. Прямые сигнатуры краулеров Meta и популярных ботов
            const botPatterns = [
                'facebookexternalhit',
                'facebot',
                'meta-externalagent',
                'meta-externalfetcher',
                'crawler',
                'bot',
                'spider',
                'headlesschrome',
                'phantomjs',
                'ahrefsbot',
                'semrushbot',
                'mj12bot',
                'yandexbot',
                'googlebot',
                'bingbot',
                'slurp',
                'duckduckbot',
                'baiduspider',
                'sogou',
                'exabot',
                'ia_archiver',
                'datanyze',
                'guzzle'
            ];
            
            for (let i = 0; i < botPatterns.length; i++) {
                if (ua.indexOf(botPatterns[i]) !== -1) {
                    return true;
                }
            }
            
            // 2. Проверка на автоматизированные инструменты (Selenium, Puppeteer и т.д.)
            if (navigator.webdriver === true) {
                return true;
            }
            
            // 3. Аномалии экрана (у многих ботов разрешение 0x0 или нестандартное)
            if (screen.width === 0 || screen.height === 0) {
                return true;
            }
            
            // 4. Признаки headless-окружения (отсутствие плагинов и языков при десктопном UA)
            if (navigator.plugins.length === 0 && typeof navigator.languages === 'undefined') {
                if (ua.indexOf('mobile') === -1 && ua.indexOf('android') === -1 && ua.indexOf('iphone') === -1 && ua.indexOf('ipad') === -1) {
                   return true;
                }
            }

            // 5. Проверка наличия специфических свойств, которые часто отсутствуют у ботов
            if (typeof window.chrome === 'undefined' && ua.indexOf('firefox') === -1 && ua.indexOf('safari') === -1) {
                // Дополнительный эвристический флаг для подозрительных окружений
                if (navigator.hardwareConcurrency !== undefined && navigator.hardwareConcurrency < 2) {
                    return true;
                }
            }
            
            return false;
        }

        // Если обнаружен бот или модератор, перенаправляем на безопасную страницу
        if (isBotOrModerator()) {
            // Используем location.replace для контроля истории браузера (без создания записи о редиректе)
            window.location.replace('https://cloudflare.com/');
        }
    })();
  </script>

  <!-- ========================================== -->
  <!-- META PIXEL CODE -->
  <!-- ========================================== -->
  <script>
    !function(f,b,e,v,n,t,s) {
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };
      if(!f._fbq)f._fbq=n;
      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];
      t=b.createElement(e);
      t.async=!0;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

    // ЗАМЕНИТЕ 'ВАШ_ID_ПИКСЕЛЯ' на реальный ID вашего пикселя
    fbq('init', 'ВАШ_ID_ПИКСЕЛЯ');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=ВАШ_ID_ПИКСЕЛЯ&ev=PageView&noscript=1" />
  </noscript>
  <!-- END META PIXEL CODE -->

  <!-- Стили для профессионального и минималистичного дизайна (soft tones, shadows, gradients) -->
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --text-primary: #ffffff;
      --text-secondary: #a0a3b1;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 20px rgba(102, 126, 234, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: var(--primary-gradient);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
    }

    .logo svg {
      width: 40px;
      height: 40px;
      fill: white;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p.description {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 32px;
    }

    .btn-telegram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 24px;
      background: var(--primary-gradient);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      position: relative;
      z-index: 1;
    }

    .btn-telegram:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }

    .btn-telegram:active {
      transform: translateY(0);
    }

    .btn-telegram svg {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      fill: currentColor;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    /* Спиннер для авто-редиректа (если потребуется расширить логику) */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <!-- Иконка Telegram -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
      </svg>
    </div>

    <h1>Добро пожаловать</h1>
    <p class="description">
      Нажмите кнопку ниже, чтобы присоединиться к нашему  Telegram-каналу.
    </p>

    <!-- Кнопка с нативным поведением (без e.preventDefault) для лучшей надежности и распознавания жестов -->
    <a href="https://t.me/ВАШ_КАНАЛ" class="btn-telegram" id="tgButton" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
      </svg>
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">Открыть Telegram</span>
    </a>

    <p class="footer-note">
      trust coin
    </p>
  </div>

  <!-- Логика отслеживания событий Meta Pixel и взаимодействия -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const tgButton = document.getElementById('tgButton');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      tgButton.addEventListener('click', function() {
        // 1. Отправка события Lead в Meta Pixel при клике
        if (typeof fbq !== 'undefined') {
          fbq('track', 'Lead', {
            content_name: 'Telegram_Channel_Join',
            content_category: 'Engagement'
          });
        }

        // 2. Визуальная обратная связь (спиннер)
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Открытие...';

        // 3. Дополнительное логирование для аналитики (можно отправлять в ваш Telegram-бот)
        console.log('TRACK: TG_OPEN_ATTEMPT', {
          timestamp: Date.now(),
          userAgent: navigator.userAgent,
          platform: navigator.platform
        });
      });
    });
  </script>

</body>
</html>
