<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Подтверждение домена Meta -->
  <meta
    name="facebook-domain-verification"
    content="1ddq5g9b9nlbak5619ajnlyjbz4xjt"
  >

  <title>Telegram Channel</title>

  <meta
    name="description"
    content="Telegram channel — присоединяйтесь к нашему каналу"
  >

  <meta name="theme-color" content="#08090d">
  <meta name="color-scheme" content="dark">

  <!-- META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s) {
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod
          ? n.callMethod.apply(n,arguments)
          : n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;

      window,

    );

    fbq('init', '1413695077434129');

  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1413695077434129&ev=PageView&noscript=1"
    />
  </noscript>

  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --primary-gradient: linear-gradient(
        135deg,
        #667eea 0%,
        #764ba2 100%
      );
      --text-primary: #ffffff;
      --text-secondary: #a0a3b1;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 20px rgba(102, 126, 234, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background-color: var(--bg-color);
      color: var(--text-primary);

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px 30px;

      max-width: 420px;
      width: 100%;

      text-align: center;

      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.05);

      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;

      top: -50%;
      left: -50%;

      width: 200%;
      height: 200%;

      background:
        radial-gradient(
          circle,
          rgba(102, 126, 234, 0.1) 0%,
          transparent 70%
        );

      pointer-events: none;
    }

    .logo {
      width: 80px;
      height: 80px;

      background: var(--primary-gradient);

      border-radius: 50%;

      margin: 0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: var(--shadow-glow);
    }

    .logo svg {
      width: 40px;
      height: 40px;
      fill: white;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;

      margin-bottom: 12px;

      letter-spacing: -0.5px;
    }

    p.description {
      color: var(--text-secondary);

      font-size: 15px;

      margin-bottom: 32px;
    }

    .btn-telegram {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 16px 24px;

      background: var(--primary-gradient);

      color: white;

      text-decoration: none;

      font-weight: 600;
      font-size: 16px;

      border-radius: 12px;

      border: none;

      cursor: pointer;

      transition: all 0.3s ease;

      box-shadow:
        0 4px 15px rgba(102, 126, 234, 0.4);

      position: relative;
      z-index: 1;
    }

    .btn-telegram:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 25px rgba(102, 126, 234, 0.5);
    }

    .btn-telegram:active {
      transform: translateY(0);
    }

    .btn-telegram svg {
      width: 20px;
      height: 20px;

      margin-right: 10px;

      fill: currentColor;
    }

    .footer-note {
      margin-top: 24px;

      font-size: 12px;

      color: var(--text-secondary);

      opacity: 0.7;
    }

    .spinner {
      display: none;

      width: 20px;
      height: 20px;

      border: 2px solid rgba(255,255,255,0.3);

      border-radius: 50%;

      border-top-color: #fff;

      animation: spin 0.8s linear infinite;

      margin-right: 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">

      <!-- Telegram icon -->
      <svg
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"
        />
      </svg>

    </div>

    <h1>Добро пожаловать</h1>

    <p class="description">
      Нажмите кнопку ниже, чтобы присоединиться к нашему Telegram-каналу.
    </p>

    <!-- Telegram -->
    <a
      href="https://t.me/+sU-JbfC2GIY0NTIy"
      class="btn-telegram"
      id="tgButton"
      target="_blank"
      rel="noopener noreferrer"
    >

      <svg
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"
        />
      </svg>

      <span
        class="spinner"
        id="btnSpinner"
      ></span>

      <span id="btnText">
        Открыть Telegram
      </span>

    </a>

    <p class="footer-note">
     Pantera full
    </p>

  </div>

  <!-- Meta Pixel Lead -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const tgButton =
        document.getElementById("tgButton");

      const btnSpinner =
        document.getElementById("btnSpinner");

      const btnText =
        document.getElementById("btnText");

      tgButton.addEventListener("click", function () {

        /* Lead при клике */
        if (typeof fbq !== "undefined") {

          fbq(
            "track",
            "Lead",
            {
              content_name: "Telegram_Channel_Join",
              content_category: "Engagement"
            }
          );

        }

        /* Визуальная обратная связь */
        btnSpinner.style.display = "inline-block";

        btnText.textContent = "Открытие...";

      });

    });
  </script>

</body>
</html>
