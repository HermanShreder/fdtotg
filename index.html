<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Gambler</title>
  <link rel="stylesheet" href="../../gmblr.pro/style.css">

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2127136807835684');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=2127136807835684&ev=PageView&noscript=1" />
  </noscript>
  <!-- End Meta Pixel Code -->
</head>
<body>
  <!-- Page -->
  <main class="page">
    <div class="card">
      <div class="avatar"></div>
      <h1>The Gambler</h1>

      <p class="subscribers">8 575 subscribers</p>

      <p class="owner">
        🎰 Профессиональный контент для представителей iGaming-рынка: обзор самых актуальных тем,
        постоянная аналитика актуальных гео и многое другое
      </p>

      <a id="tgButton" class="btn" href="https://t.me/MilaNoirOF">
        JOIN CHANNEL
      </a>
    </div>
  </main>

  <!-- Скрипт логирования заходов, кликов и User-Agent -->
  <script>
    // Функция отправки логов
    function sendLog(actionType) {
      var ua = navigator.userAgent || 'Unknown';
      var logData = new URLSearchParams({
        action: actionType,
        userAgent: ua,
        timestamp: new Date().toISOString()
      });

      // Отправка данных на ваш сервер (замените '/api/log' на ваш реальный обработчик, если он есть)
      // Если обработчика нет, данные просто будут видны во вкладке Network в браузере
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/log', logData);
      } else {
        fetch('/api/log', { method: 'POST', body: logData, keepalive: true }).catch(function(){});
      }
      
      console.log('Log recorded:', actionType, ua);
    }

    // 1. Логируем сам заход на страницу
    sendLog('PAGE_VISIT');

    // 2. Логируем клик по кнопке
    document.addEventListener('DOMContentLoaded', function() {
      var tgBtn = document.getElementById('tgButton');
      if (tgBtn) {
        tgBtn.addEventListener('click', function(e) {
          // Отправляем лог о клике
          sendLog('BUTTON_CLICK');
          
          // Дополнительно отправляем событие Lead в Meta Pixel
          if (typeof fbq === 'function') {
            fbq('track', 'Lead', { content_name: 'join_channel_click' });
          }
        });
      }
    });
  </script>
</body>
</html>
