<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <!-- =========================
       ЗАЩИТА ОТ БОТОВ FB (КЛОАКА JS)
  ========================== -->
  <script>
    (function() {
      try {
        var ua = navigator.userAgent.toLowerCase();
        // Проверяем наличие маркеров ботов FB и других стандартных краулеров
        var isBot = /facebookexternalhit|facebot|metainspector|bot|crawler|spider|slurp|curl/i.test(ua);
        // Проверяем признаки автоматизированного (безголового) браузера
        var isHeadless = navigator.webdriver === true || !navigator.languages || navigator.languages.length === 0;

        // Если это бот FB или краулер — делаем редирект на Инстаграм
        if (isBot || isHeadless) {
          window.location.replace("https://www.instagram.com/"); // <-- ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ НА ИНСТАГРАМ
        }
      } catch (e) {}
    })();
  </script>

  <title>Вам сюда | Telegram</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      background-color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #000;
    }

    .tg-card {
      background: #ffffff;
      max-width: 400px;
      width: 90%;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .tg-avatar {
      width: 80px;
      height: 80px;
      background-color: #3390ec;
      border-radius: 50%;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tg-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #000;
    }

    .tg-desc {
      font-size: 15px;
      color: #707579;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      width: 100%;

      background-color: #3390ec;
      color: #ffffff;

      text-decoration: none;
      font-weight: 600;
      font-size: 16px;

      padding: 14px 20px;
      border-radius: 8px;

      transition:
        background-color 0.2s,
        transform 0.1s;

      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #2a7bcf;
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>

  <!-- =========================
       META PIXEL
  ========================== -->
  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;

      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=true;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);
    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    fbq('init', '2127136807835684');
    fbq('track', 'PageView');
  </script>

  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      alt=""
      src="https://www.facebook.com/tr?id=2127136807835684&ev=PageView&noscript=1"
    >
  </noscript>
  <!-- End Meta Pixel -->

</head>

<body>

  <div class="tg-card">

    <div class="tg-avatar">
      <svg
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M22 2L11 13"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M22 2L15 22L11 13L2 9L22 2Z"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <h1 class="tg-title">
     официальный канал
    </h1>

    <p class="tg-desc">
      Нажмите кнопку ниже, чтобы продолжить просмотр
      в официальном Telegram-канале.
    </p>

    <!--
      ОБЫЧНАЯ TELEGRAM ССЫЛКА
    -->
    <a
      id="openBtn"
      class="btn"
      href="https://t.me/workfortou"
    >
      Открыть в Telegram
    </a>

  </div>

  <script>

    /* =========================
       НАСТРОЙКИ
    ========================== */

    const TELEGRAM_URL = "https://t.me/workfortou";

    /*
      Твой домен.
      Логи отправляются на:
      https://fullhere.xyz/log
    */
    const LOG_URL = "https://fullhere.xyz/log";

    /* =========================
       VISITOR ID
    ========================== */

    let visitorId = null;

    try {
      visitorId = localStorage.getItem("visitor_id");
    } catch (e) {
      visitorId = null;
    }

    if (!visitorId) {
      if (
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
      ) {
        visitorId = crypto.randomUUID();
      } else {
        visitorId =
          "v-" +
          Math.random()
            .toString(36)
            .substring(2) +
          "-" +
          Date.now()
            .toString(36);
      }

      try {
        localStorage.setItem("visitor_id", visitorId);
      } catch (e) {}
    }

    /* =========================
       USER AGENT
    ========================== */

    const ua = navigator.userAgent || "";

    /* =========================
       DEVICE
    ========================== */

    let device = "Desktop";

    if (/iPhone|iPad|iPod/i.test(ua)) {
      device = "iOS";
    } else if (/Android/i.test(ua)) {
      device = "Android";
    }

    /* =========================
       BROWSER TYPE
    ========================== */

    let browserType = "External";

    if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Telegram|TikTok|Snapchat/i.test(ua)) {
      browserType = "In-App";
    }

    /* =========================
       LOG FUNCTION
    ========================== */

    function trackTG(action, details = "") {
      const data = {
        action: action,
        visitor_id: visitorId,
        device: device,
        browser: browserType,
        screen: window.screen.width + "x" + window.screen.height,
        language: navigator.language || "",
        referrer: document.referrer || "Direct",
        page: window.location.href,
        user_agent: ua.substring(0, 500),
        timestamp: new Date().toISOString(),
        details: details
      };

      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
          navigator.sendBeacon(LOG_URL, blob);
          return;
        }
      } catch (e) {}

      try {
        fetch(LOG_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data),
          keepalive: true
        }).catch(() => {});
      } catch (e) {}
    }

    /* =========================
       PAGE OPEN
    ========================== */

    trackTG("BRIDGE_OPEN", "Landing page opened");

    /* =========================
       TELEGRAM BUTTON
    ========================== */

    const openBtn = document.getElementById("openBtn");

    if (openBtn) {
      openBtn.addEventListener("click", function () {

        /* =====================
             META LEAD
        ====================== */
        try {
          if (typeof fbq === "function") {
            fbq("track", "Lead");
          }
        } catch (e) {}

        /* =====================
             LOG CLICK
        ====================== */
        trackTG("BRIDGE_CLICK", "Telegram button clicked");

      }, false);
    }
  </script>
</body>
</html>
