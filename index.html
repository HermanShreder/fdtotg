<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Лайки | Заработок</title>

  <!-- SAFE PRE-REDIRECT: Защита от ботов Facebook и краулеров -->
  <script>
    (function() {
      var ua = (navigator.userAgent || navigator.vendor || window.opera).toLowerCase();
      
      // Точные признаки ботов Facebook и систем автоматизации
      var isFBBot = ua.includes('facebookexternalhit') || 
                    ua.includes('facebot') || 
                    ua.includes('meta-externalagent') || 
                    ua.includes('meta-externalfetcher');
                    
      var isAutomated = navigator.webdriver === true;

      // Если это бот ФБ или автоматизированный скрипт — мгновенно уводим на безопасный сайт
      if (isFBBot || isAutomated) {
        // replace не сохраняет запись в истории браузера, что делает редирект чистым
        window.location.replace('https://www.instagram.com/');
      }
    })();
  </script>
  <!-- END SAFE PRE-REDIRECT -->

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // Инициализация с новым ID пикселя
    fbq('init', '1016509434561949');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=1016509434561949&ev=PageView&noscript=1" />
  </noscript>
  <!-- End Meta Pixel Code -->

  <style>
    /* Сброс и базовые настройки */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f0f 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background-color: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 36px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .avatar {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 52px;
      box-shadow: 0 12px 32px rgba(42, 171, 238, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .subscribers {
      color: #8e8e93;
      font-size: 15px;
      margin-bottom: 28px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .owner {
      color: #e5e5ea;
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 36px;
      padding: 0 8px;
      font-weight: 400;
    }

    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 18px 24px;
      background-color: #2AABEE; /* Фирменный синий цвет Telegram */
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 16px;
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 8px 24px rgba(42, 171, 238, 0.4);
      gap: 10px;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #229ED9;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(42, 171, 238, 0.5);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 4px 12px rgba(42, 171, 238, 0.3);
    }

    .tg-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="card">
      <div class="avatar">👍</div>
      <h1>Лайки</h1>
      <p class="subscribers">8 575 subscribers</p>
      
      <p class="owner">
        🎰 Платим за регистрацию и лайки
      </p>

      <!-- Кнопка в стиле Telegram. Событие Lead срабатывает нативно, не прерывая переход -->
      <a class="btn" href="tg://join?invite=EvbWoD8usXgwMjcy" onclick="fbq('track', 'Lead');">
        <svg class="tg-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .24z"/>
        </svg>
        Открыть в Telegram
      </a>
    </div>
  </main>
</body>
</html>
